<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css" integrity="sha384-GJzZqFGwb1QTTN6wy59ffF1BuGJpLSa9DkKMp0DgiMDm4iYMj70gZWKYbI706tWS" crossorigin="anonymous">

	<title>Homepage</title>
	
	<style>
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        h2 {
            color: #ffffff;
            font-family: 'Times New Roman', Times, serif;
        }
        
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        header {
            text-align: center;
            padding: 20px;
            background-color: #333;
            color: white;
            width: 100%;
        }

        .buttons {
        	margin-right: 100px;
            margin-top: auto;
            text-align: center;
        }

        .btn {
            margin: 10px;
        }
        
    </style>
    
</head>


<body>

<body style="background-color: #000000;">
<div class="container">

<h2>The Book Application</h2>
 
 <br> <br> <hr> <br> <br>
 
  <div sec:authorize="hasRole('ROLE_ANONYMOUS')">
    <p>
		<a th:href="@{/login}" class="btn btn-light btn-sm mb-3" th:text="Login"></a>
		<a th:href="@{/register}" class="btn btn-light btn-sm mb-3" th:text="Register"></a>
		
    </p>
  </div>
    <br> 
    
    <p sec:authorize="hasAuthority('USER')">
    	<a th:href="@{/user/dashboard}" class="btn btn-light btn-sm"> User Dashboard</a>
    	<a th:href="@{/logout}" class="btn btn-light btn-sm"> Logout</a>
    </p>
    
    <p sec:authorize="hasAuthority('ADMIN')">
    	<a th:href="@{/admin/dashboard}" class="btn btn-primary btn-sm mb-3"> Admin Dashboard</a>
    	<a th:href="@{/logout}" class="btn btn-danger btn-sm mb-3"> Logout</a>	
    </p>

</div>
</body>
</html>
