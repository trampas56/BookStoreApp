<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css" integrity="sha384-GJzZqFGwb1QTTN6wy59ffF1BuGJpLSa9DkKMp0DgiMDm4iYMj70gZWKYbI706tWS" crossorigin="anonymous">

    <title>User Dashboard</title>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Times New Roman', Times, serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            padding: 20px;
            background-color: #333;
            color: white;
            width: 100%;
        }

        .container {
            text-align: center;
            margin-top: 50px;
        }

        .btn-container {
            position: absolute;
            top: 20px;
            left: 20px;
        }
		.btn-container-right {
    		position: absolute;
    		top: 20px;
    		right: 20px;
		}

        .btn {
            margin: 5px;
        }
    </style>
</head>

<body>

<header>
    <h2>Welcome <span sec:authentication="name"></span></h2>
</header>



<div class="btn-container">
    <a th:href="@{/}" class="btn btn-light btn-sm">Home</a>
    <a th:href="@{/searchForm}" class="btn btn-light btn-sm">Search</a>
    <a th:href="@{/showNotifications}" class="btn btn-light btn-sm">Notifications</a>
    <a th:href="@{/logout}" class="btn btn-light btn-sm">Logout</a>
</div>
<div class="btn-container-right">
     <a th:href="@{/booklist}" class="btn btn-light btn-sm">My Books</a>
</div>


<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</body>
</html>
