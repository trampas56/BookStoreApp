<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css" integrity="sha384-GJzZqFGwb1QTTN6wy59ffF1BuGJpLSa9DkKMp0DgiMDm4iYMj70gZWKYbI706tWS" crossorigin="anonymous">

	<title>Register</title>
	
	<style>
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        h3 {
            color: #ffffff;
            font-family: 'Times New Roman', Times, serif;
        }
        
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        header {
            text-align: center;
            padding: 20px;
            background-color: #333;
            color: white;
            width: 100%;
        }

        .buttons {
        	margin-right: 100px;
            margin-top: auto;
            text-align: center;
        }

        .btn {
            margin: 10px;
        }
        
    </style>
</head>


<body>
<body style="background-color: #000000;">

<div class="container">

  <form 
  action="#" 
  th:action="@{/save}" th:object="${user}" method="post">
    <h3>Registration</h3>
    <input type="text" th:field="*{username}" placeholder="User Name" /> <br/><br/>
     <input type="password" th:field="*{password}" placeholder="Password" /> <br/><br/>
   
   
    
    <button type="submit" class="btn btn-light btn-sm mb-3">Register</button> 
    
    <a th:href="@{/login}" class="btn btn-light btn-sm mb-3"> Login</a>
    
    <div th:if="${param.error}"><p>Registration Error.</p></div> <br/>
    
    <div th:utext="${successMessage}"></div>
</form>
</body>
</html>
