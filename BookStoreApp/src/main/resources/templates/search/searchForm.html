<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Required meta tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css" integrity="sha384-GJzZqFGwb1QTTN6wy59ffF1BuGJpLSa9DkKMp0DgiMDm4iYMj70gZWKYbI706tWS" crossorigin="anonymous">

    <title>SearchBook</title>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Times New Roman', Times, serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            padding: 20px;
            background-color: #333;
            color: white;
            width: 100%;
            text-align: center;
        }

        .container {
            text-align: center;
            margin-top: 50px;
        }
    </style>
</head>
<body>

<header>
    <h2>Search Book</h2>
</header>

<div class="container">
    <form th:action="@{/search}" th:object="${searchFormData}" method="post">
    	<div class="form-select">
	        <select class="form-select form-control" th:field="*{strategy}">
	            <option th:value="1" th:text="Exact" />
	            <option th:value="2" th:text="Approximate" />
	        </select>
        
		</div><br/><br/>
        <input type="text" th:field="*{title}" placeholder="Title" class="form-control" /><br/><br/>
        <label class="form-label">Book Authors:</label>
        <select class="form-select form-control" multiple th:field="*{bookAuthorsId}">
            <option th:each="p : ${listBookAuthors}" th:value="${p.authorId}" th:text="${p.name}" />
        </select>
        
        
        <br/>
        <button type="submit" class="btn btn-light btn-sm">Search</button>
    </form>
</div>

<!-- Optional JavaScript -->
<!-- jQuery first, then Popper.js, then Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</body>
</html>
